# MongoDB Helm Chart Values
# Using official MongoDB 8.0 Docker images from Docker Hub

# Image configuration (official mongo:8.0)
image:
  registry: "docker.io"
  repository: "mongo"
  tag: "8.0"
  pullPolicy: IfNotPresent

# Storage configuration
storage:
  # Storage class name
  className: ""
  # Storage size
  size: "1Gi"
  # Access mode
  accessModes:
    - ReadWriteOnce

# Resource limits
resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 500m

# Environment variables for MongoDB initialization
env:
  - name: MONGO_INITDB_DATABASE
    value: "okteto"
  - name: MONGO_INITDB_ROOT_USERNAME  
    value: "root"
  - name: MONGO_INITDB_ROOT_PASSWORD
    value: "okteto"

# Custom initialization script
customScripts:
  init.js: |
    // Initialize MongoDB with okteto user and database
    db = db.getSiblingDB('okteto');
    
    db.createUser({
      user: 'okteto',
      pwd: 'okteto',
      roles: [
        {
          role: 'readWrite',
          db: 'okteto'
        }
      ]
    });
    
    print('Created okteto user and database');

# Service configuration
service:
  type: ClusterIP
  port: 27017

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3