dependencies:
  mongodb:
    repository: https://github.com/okteto/mongodb
    variables:
      MONGODB_PASSWORD: movies
  movies-frontend:
    repository: https://github.com/okteto/movies-frontend
    wait: true
  movies-api:
    repository: https://github.com/okteto/movies-api
    depends_on: mongodb
    variables:
      MONGODB_URL: ${OKTETO_DEPENDENCY_MONGODB_VARIABLE_MONGODB_URL}
    wait: true

deploy:
  - name: Expose the Movies app
    command: kubectl apply -f k8s.yml
  - name: Check the Movies API
    command: |
      curl --fail --silent --retry 10 --retry-all-errors -o movies.json https://movies-${OKTETO_NAMESPACE}.${OKTETO_DOMAIN}/api/movies
      jq -r '.[].original_title' movies.json
